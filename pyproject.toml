[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agcl"
version = "0.1.0"
description = "Hybrid local–cloud control plane for multi-agent research and infra orchestration."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.28.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "llama-cpp-python>=0.2.77",
    "openai>=1.30.0",
    "pillow>=10.0.0",
    "prompt-toolkit>=3.0.43",
    "tiktoken>=0.7.0",
    "torch>=2.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
agcl = "agcl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
